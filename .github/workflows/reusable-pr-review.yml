name: Reusable PR Review

on:
  workflow_call:
    inputs:
      target_base_branch:
        description: "Optional base branch filter. Empty means run for PRs targeting any base branch."
        required: false
        type: string
        default: ""
      dry_run:
        description: "If true, generate review output without posting PR comments."
        required: false
        type: boolean
        default: false
      review_scope:
        description: "Review scope. latest_commit is default; full_pr is optional override."
        required: false
        type: string
        default: latest_commit
      comment_mode:
        description: "Comment mode. inline_only posts line-level PR comments only."
        required: false
        type: string
        default: inline_only
      expected_reviewer_login:
        description: "Optional identity guard for CENTRAL_REVIEW_GH_TOKEN login."
        required: false
        type: string
        default: ""
    secrets:
      CENTRAL_REVIEW_GH_TOKEN:
        required: true
      CENTRAL_REVIEW_LLM_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  run-review:
    if: github.event_name == 'pull_request' && (inputs.target_base_branch == '' || github.base_ref == inputs.target_base_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central agent repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ai-code-review-agent
          path: ai-code-review-agent

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run review
        working-directory: ai-code-review-agent
        env:
          GITHUB_TOKEN: ${{ secrets.CENTRAL_REVIEW_GH_TOKEN }}
          GITHUB_TOKEN_EXPECTED_LOGIN: ${{ inputs.expected_reviewer_login }}
          LLM_API_KEY: ${{ secrets.CENTRAL_REVIEW_LLM_API_KEY }}
          # Centralized defaults: callers must not pass llm_model/llm_base_url.
          LLM_MODEL: gpt-oss-120b
          LLM_BASE_URL: http://litellm-alb-1953047705.us-east-1.elb.amazonaws.com/v1
          DRY_RUN: ${{ inputs.dry_run }}
          REVIEW_SCOPE: ${{ inputs.review_scope }}
          COMMENT_MODE: ${{ inputs.comment_mode }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          SKILL_PATH: .github/skills/code-review-pro/SKILL.md
        run: python scripts/review_pr.py
